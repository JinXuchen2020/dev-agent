name: CI

on:
  push:
    branches: [master]
  pull_request:
    branches: [master]

env:
  DOTNET_VERSION: 9.0.x
  OPENAI_API_KEY: ${{ vars.OPENAI_API_KEY }}
  OPENAI_BASE_URL: ${{ vars.OPENAI_BASE_URL }}
  OPENAI_MODEL: ${{ vars.OPENAI_MODEL }}
  # F37 SkippableFact 门控：RabbitMQ guest 用户默认仅允许 loopback 登录，而 runner 经发布端口
  # 的连接从 docker 网桥进入（非 loopback）会被 broker 拒绝 → 队列测试在 CI 恒静默跳过。
  # 故 service 用非 guest 默认用户，测试侧经本环境变量取同凭据。
  ConnectionStrings__RabbitMQ: amqp://apci:apci@localhost:5672

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    # F37 队列后端集成测试（SkippableFact）依赖真实中间件：无服务时自动跳过，有则跑投递闭环。
    services:
      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 5
      rabbitmq:
        image: rabbitmq:3.13-management-alpine
        ports:
          - 5672:5672
        env:
          RABBITMQ_DEFAULT_USER: apci
          RABBITMQ_DEFAULT_PASS: apci
        options: >-
          --health-cmd "rabbitmq-diagnostics -q ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    steps:
      - uses: actions/checkout@v4

      - name: Setup .NET ${{ env.DOTNET_VERSION }}
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: ${{ env.DOTNET_VERSION }}

      - name: Restore
        run: dotnet restore src/AgentPlatform.sln

      - name: Check for known vulnerable packages
        run: |
          dotnet list src/AgentPlatform.sln package --vulnerable 2>&1 | tee vuln-report.txt
          if grep -q "has known vulnerable" vuln-report.txt; then
            echo "⚠️  Known vulnerable packages found!"
            grep -A2 "has known vulnerable" vuln-report.txt
            exit 1
          fi
          echo "✅ No known vulnerable packages."

      - name: Build
        run: dotnet build src/AgentPlatform.sln --no-restore --configuration Release

      - name: Run unit + architecture tests
        run: dotnet test src/AgentPlatform.sln --no-build --configuration Release --filter "FullyQualifiedName!~IntegrationTests&FullyQualifiedName!~SpecFlowTests"

      - name: Run integration tests
        if: false  # Integration tests need Docker. Enable when Docker is available on runner.
        run: dotnet test src/AgentPlatform.sln --no-build --configuration Release --filter "FullyQualifiedName~IntegrationTests"

  integration:
    runs-on: ubuntu-latest
    needs: build-and-test
    environment: api-key
    steps:
      - uses: actions/checkout@v4

      - name: Setup .NET ${{ env.DOTNET_VERSION }}
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: ${{ env.DOTNET_VERSION }}

      - name: Restore
        run: dotnet restore src/AgentPlatform.sln

      - name: Build
        run: dotnet build src/AgentPlatform.sln --no-restore --configuration Release

      # F27 集成闸门（后端 BDD）：真实 HTTP + 文件 SQLite，无 Docker 依赖，跨平台可跑。
      # 前端 E2E（Playwright + Edge）为 Windows 本机本地闸门，见 scripts/integration.mjs --e2e。
      - name: Run backend BDD (Reqnroll + file SQLite)
        run: dotnet test src/AgentPlatform.SpecFlowTests --configuration Release --logger "console;verbosity=minimal"

  frontend-e2e:
    runs-on: ubuntu-latest
    needs: build-and-test
    environment: api-key
    steps:
      - uses: actions/checkout@v4

      - name: Setup .NET ${{ env.DOTNET_VERSION }}
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: ${{ env.DOTNET_VERSION }}

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Restore .NET
        run: dotnet restore src/AgentPlatform.sln

      - name: Install frontend dependencies
        working-directory: src/AgentPlatform.Web
        run: npm ci

      # 跨平台 Chromium（替代本机 Edge）：ubuntu runner 经 --with-deps 装齐系统库。
      - name: Install Playwright Chromium browser
        working-directory: src/AgentPlatform.Web
        run: npx playwright install --with-deps chromium

      # 仅前端 E2E：后端 BDD 已由 integration job 覆盖，故 --skip-bdd 避免重复。
      # 浏览器默认 Playwright 自带 Chromium；CI 环境变量存在 → 自动 headless。
      - name: Run frontend E2E (BDD, Chromium)
        run: node scripts/integration.mjs --e2e --skip-bdd
        env:
          CI: 'true'
          OPENAI_API_KEY: ${{ vars.OPENAI_API_KEY }}
          OPENAI_BASE_URL: ${{ vars.OPENAI_BASE_URL }}
          OPENAI_MODEL: ${{ vars.OPENAI_MODEL }}

  quality-gate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0   # need history to diff against base

      - name: Determine base ref
        id: base
        run: |
          if [ -n "${{ github.event.pull_request.base.sha }}" ]; then
            echo "ref=${{ github.event.pull_request.base.sha }}" >> "$GITHUB_OUTPUT"
          elif [ -n "${{ github.event.before }}" ] && git cat-file -e "${{ github.event.before }}^{commit}" 2>/dev/null; then
            echo "ref=${{ github.event.before }}" >> "$GITHUB_OUTPUT"
          else
            echo "ref=HEAD~1" >> "$GITHUB_OUTPUT"
          fi

      - name: Check quality gate marker
        run: |
          BASE="${{ steps.base.outputs.ref }}"
          CHANGED=$(git diff --name-only "$BASE" HEAD | grep '^src/' || true)
          if [ -n "$CHANGED" ]; then
            echo "⛔ 检测到 src/ 改动，校验质量结论标记 .quality-gate.json ..."
            if [ ! -f .quality-gate.json ]; then
              echo "❌ 缺少 .quality-gate.json（质量结论标记）。请先跑 ddd-code-reviewer + ddd-phase-quality-gate 至 0 open findings，"
              echo "   并在阶段完成时跑 codebase-optimizer，然后提交该标记。"
              echo "   约定见 docs/quality/QUALITY-GATE.md"
              exit 1
            fi
            if ! grep -q '"cleared": *true' .quality-gate.json; then
              echo "❌ .quality-gate.json 中 cleared 不为 true（仍有未修复问题）。"
              exit 1
            fi
            if ! grep -q '"codebaseOptimizer"' .quality-gate.json; then
              echo "❌ .quality-gate.json 中缺少 codebaseOptimizer 字段。"
              echo "   Phase 5 过渡期可写 not_run，Phase 6+ 需 PASSED。"
              echo "   约定见 docs/quality/QUALITY-GATE.md"
              exit 1
            fi
            echo "✅ 质量门通过：.quality-gate.json cleared:true + codebaseOptimizer fields（src/ 改动已带质量结论标记）"
          else
            echo "✅ 本次事件未改 src/，跳过质量门。"
          fi
